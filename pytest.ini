[pytest]
# 测试代码统一放在 test/ 目录（与 README 目录结构保持一致）
testpaths = test

# 把仓库根目录加入 sys.path，这样 test/ 里可以直接 `import board` / `import rule`。
# 没有这行时，直接执行 `pytest`（而不是 `python -m pytest`）会报：
#   ModuleNotFoundError: No module named 'board'
pythonpath = .

python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q --strict-markers
