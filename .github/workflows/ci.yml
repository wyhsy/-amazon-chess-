name: CI

on:
  # 所有分支的 push 都跑，避免 docs/* 、chore/* 这类分支“push 了却等不到检查”
  push:
  pull_request:
    branches: [main, dev]

jobs:
  test:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 组员系统不一致，所以 Windows + Linux 都跑；
        # 若感觉 Actions 排队太久，可只保留 ubuntu-latest / 3.11 一组
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: 运行单元测试
        # 注意用 `python -m pytest` 而不是裸 `pytest`：
        # 前者会把仓库根加入 sys.path，test/ 里才能 import board / rule
        # （配合 pytest.ini 里的 pythonpath = . 双保险）
        # dummy 驱动让 pygame 能在无显示器的 CI 里被导入
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python -m pytest -q

      - name: 代码风格检查（不阻塞合并）
        continue-on-error: true
        run: |
          pip install ruff
          ruff check .
